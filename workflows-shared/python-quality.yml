# Reusable Python quality gates for the fileworks CLIs.
#
# Only the *stable* half lives here: checking out, setting up uv, syncing the
# locked environment, and running the four checks every Python CLI in the family
# runs identically. Publishing, signing, platform packaging, and each product's
# own matrix stay in the consumer — a shared workflow that could publish would
# put release permissions behind a revision nobody reviews per repository.
#
# Consumers pin this by commit SHA, never by branch. A moving reference here is
# a moving reference into every repository at once.

name: python-quality

on:
  workflow_call:
    inputs:
      python-version:
        description: The interpreter to run the gates on.
        required: false
        type: string
        default: "3.12"
      runs-on:
        required: false
        type: string
        default: ubuntu-latest
      audit:
        description: Run the dependency audit gate.
        required: false
        type: boolean
        default: true
    outputs:
      revision:
        description: The revision of this reusable workflow, for traceability.
        value: ${{ jobs.gates.outputs.revision }}

permissions:
  contents: read

jobs:
  gates:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v5

      - id: revision
        run: echo "sha=${{ github.workflow_sha }}" >> "$GITHUB_OUTPUT"

      # astral-sh/setup-uv, pinned by SHA for the same reason this file is.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install the locked environment
        run: uv sync --locked --all-extras --dev

      - name: format
        run: uv run ruff format --check .

      - name: lint
        run: uv run ruff check .

      - name: typecheck
        run: uv run mypy

      - name: test
        run: uv run pytest -q

      - name: dependency-audit
        if: inputs.audit
        run: |
          uv export --locked --all-extras --no-dev --no-emit-project \
            --format requirements-txt \
            --output-file dependency-audit-requirements.txt
          uvx --from pip-audit==2.9.0 pip-audit --version
          uvx --from pip-audit==2.9.0 pip-audit \
            --requirement dependency-audit-requirements.txt --strict
