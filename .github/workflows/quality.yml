name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# This package is imported as `maintenance.*` from the directory that contains
# it, so every job checks out into a `maintenance/` subdirectory and runs the
# tools from the parent. That reproduces the workspace layout exactly, which is
# why `python -m maintenance.cli` needs no path juggling here or locally.
jobs:
  quality:
    name: quality (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          path: maintenance
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: maintenance/uv.lock
      - name: Install locked development environment
        working-directory: maintenance
        run: uv sync --locked --all-groups --python "${{ matrix.python }}"
      - name: Check formatting
        run: uv run --project maintenance ruff format --check maintenance/
      - name: Lint
        run: uv run --project maintenance ruff check maintenance/
      - name: Type check
        run: >-
          uv run --project maintenance mypy --strict
          --config-file maintenance/pyproject.toml maintenance/
      # The two branding tests need MediaSorter's generator, which is not checked
      # out here, so they skip. They are covered by the branding job below, which
      # checks out both repositories and refuses to let them skip.
      - name: Test
        run: uv run --project maintenance python -m pytest maintenance/tests

  branding:
    name: branding pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: maintenance
      # The SVG-to-raster step is the thing that stops branding drifting, so it
      # is proven to run rather than assumed. Skipping it here would recreate the
      # gap where nobody noticed the generator could not execute at all.
      - uses: actions/checkout@v7
        with:
          repository: fileworks/media-sorter
          path: media-sorter
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install rasterizer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
      - name: Install locked development environment
        working-directory: maintenance
        run: uv sync --locked --all-groups
      # A skip here would mean the rasterizer or Pillow went missing again, which
      # is the exact failure this job exists to catch. pytest exits 0 on a skip,
      # so the summary is inspected rather than trusted.
      - name: Run the branding tests, failing if any skips
        run: |
          set -o pipefail
          uv run --project maintenance python -m pytest \
            maintenance/tests/test_rollout.py -q -rs | tee pytest.log
          if grep -qE '[0-9]+ skipped' pytest.log; then
            echo "::error::branding tests skipped in the job that must run them"
            exit 1
          fi
      # The generator derives its own root from __file__, so cwd is irrelevant.
      - name: Verify MediaSorter branding is not stale
        run: >-
          uv run --project maintenance python
          media-sorter/scripts/generate_branding.py --check

  docs-links:
    name: docs-links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Generated by maintenance/workflows.py — regenerate, do not hand-edit.
      # Dependency-free on purpose: a link checker that needs a marketplace
      # action is a link checker that breaks when that action moves.
      - name: docs-links
        shell: python
        run: |
          import pathlib, re, sys

          link = re.compile(r"\[[^\]]*\]\(([^)\s]+)\)")
          skip = {
              ".git", ".venv", "node_modules", "dist", "build", "target",
              "site-packages", "_internal", "resources", "vendor",
          }
          problems = []

          for markdown in pathlib.Path(".").rglob("*.md"):
              if any(part in skip for part in markdown.parts):
                  continue
              for target in link.findall(markdown.read_text(encoding="utf-8", errors="replace")):
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  if not (markdown.parent / target.split("#")[0]).exists():
                      problems.append(f"{markdown}: {target} does not exist")

          for problem in problems:
              print(problem)
          sys.exit(1 if problems else 0)

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: maintenance
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Audit the locked governance environment
        working-directory: maintenance
        run: |
          uv export --locked --all-groups --no-emit-project \
            --format requirements-txt --output-file dependency-audit-requirements.txt
          uvx --from pip-audit==2.9.0 pip-audit \
            --requirement dependency-audit-requirements.txt --strict
